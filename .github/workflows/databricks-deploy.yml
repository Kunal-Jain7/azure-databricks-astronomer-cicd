name: Databricks - Deploy

# Flow: plan -> approve -> [sync Key Vault] -> deploy bundle.
# Triggered by pushes to the long-lived environment branches DEV, UAT and PROD.
#
# Repository variables (all optional):
#   RUNNER_LABEL        runner label, e.g. the client's ARC runner set        (default: ubuntu-latest)
#   KEYVAULT_SYNC_MODE  always | on-request                                   (default: always)
#
# Client runners: add the company root CA step as the FIRST step of every job
#   - uses: Sanofi-InnerSource/github-actions-library/setup-root-ca@main
# The deploy job needs no Azure CLI: it authenticates to Databricks with GitHub OIDC.

on:
  push:
    branches: [DEV, UAT, PROD]
    paths:
      - 'databricks/**'
      - 'keyvault/**'
      - 'scripts/**'
      - '.github/workflows/databricks-deploy.yml'
      - '.github/workflows/keyvault-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Determine environment, deploy and sync
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      target: ${{ steps.plan.outputs.target }}
      deploy: ${{ steps.plan.outputs.deploy }}
      sync: ${{ steps.plan.outputs.sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes over the complete push range
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/detect_changes.sh "$BEFORE_SHA" "$GITHUB_SHA"

      - name: Resolve target, deploy and sync
        id: plan
        env:
          DOMAIN: databricks
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          KEYVAULT_SYNC_MODE: ${{ vars.KEYVAULT_SYNC_MODE }}
          BASE_USABLE: ${{ steps.detect.outputs.base_usable }}
          CHG_DATABRICKS: ${{ steps.detect.outputs.databricks }}
          CHG_ORCHESTRATION: ${{ steps.detect.outputs.orchestration }}
          CHG_IMAGE: ${{ steps.detect.outputs.orchestration_image }}
          CHG_REQUEST: ${{ steps.detect.outputs.keyvault_request }}
        run: bash scripts/resolve_plan.sh

  # Single approval prompt per run. Put the required reviewers on the <env>-approval environments
  # (dev-approval, uat-approval, prod-approval); the jobs below then do not prompt again.
  approve:
    name: Approval
    needs: plan
    if: needs.plan.outputs.deploy == 'true' || needs.plan.outputs.sync == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: ${{ needs.plan.outputs.target }}-approval
    steps:
      - run: echo "Approved for ${{ needs.plan.outputs.target }}"

  sync-keyvault:
    name: Synchronize Key Vault
    needs: [plan, approve]
    if: needs.plan.outputs.sync == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/keyvault-sync.yml
    with:
      target: ${{ needs.plan.outputs.target }}
      runner: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    secrets: inherit

  deploy:
    name: Deploy Azure Databricks bundle
    needs: [plan, approve, sync-keyvault]
    if: ${{ always() && needs.plan.result == 'success' && needs.approve.result == 'success' && (needs.sync-keyvault.result == 'success' || needs.sync-keyvault.result == 'skipped') && needs.plan.outputs.deploy == 'true' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: ${{ needs.plan.outputs.target }}
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_catalog: ${{ vars.DATABRICKS_CATALOG }}
      BUNDLE_VAR_schema: ${{ vars.DATABRICKS_SCHEMA }}
      BUNDLE_VAR_airflow_sp_application_id: ${{ vars.DATABRICKS_AIRFLOW_SP_APPLICATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install build

      - name: Stamp wheel version with the commit SHA
        # Same commit => same version in dev, uat and prod.
        working-directory: databricks
        run: sed -i "s/^version = .*/version = \"0.1.0+g${GITHUB_SHA::7}\"/" pyproject.toml

      # Pin to a reviewed release tag or commit SHA before production use. The original starter
      # pinned v0.9.0, which could not be verified; Databricks' own example uses @main.
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks identity
        run: databricks current-user me

      - name: Validate bundle
        working-directory: databricks
        run: databricks bundle validate -t "${{ needs.plan.outputs.target }}"

      - name: Deploy bundle and build wheel
        working-directory: databricks
        run: databricks bundle deploy -t "${{ needs.plan.outputs.target }}"

      - name: Summary
        run: |
          {
            echo "### Databricks deployed: ${{ needs.plan.outputs.target }}"
            echo "Commit: $GITHUB_SHA"
            echo "Key Vault sync: ${{ needs.plan.outputs.sync }}"
          } >> "$GITHUB_STEP_SUMMARY"
