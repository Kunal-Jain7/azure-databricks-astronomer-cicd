name: Astronomer - Deploy

# Flow: plan -> approve -> [sync Key Vault] -> deploy to Astronomer.
# Triggered by pushes to the long-lived environment branches DEV, UAT and PROD.
#
# Deploy Databricks first (databricks-deploy.yml): the DAG looks Databricks jobs up by name at runtime,
# and its schedule stays off until the job deployment has been verified.
#
# Repository variables (all optional):
#   RUNNER_LABEL        runner label, e.g. the client's ARC runner set        (default: ubuntu-latest)
#   KEYVAULT_SYNC_MODE  always | on-request                                   (default: always)
#
# Environment variable:  ASTRO_DEPLOYMENT_ID  (one Astronomer deployment per environment)
# Environment secret:    ASTRO_API_TOKEN      (deployment-scoped API token; Astronomer documents API tokens
#                                              for CI/CD, with no OIDC option in the docs reviewed)
#
# Client runners: add the company root CA step as the FIRST step of every job
#   - uses: Sanofi-InnerSource/github-actions-library/setup-root-ca@main
# Image deploys (deploy-type image-and-dags) build a Docker image, so the runner needs Docker.
# DAG-only deploys (dags-only) need DAG-only deploys enabled on the Astronomer deployment.

on:
  push:
    branches: [DEV, UAT, PROD]
    paths:
      - 'orchestration/**'
      - 'keyvault/**'
      - 'scripts/**'
      - '.github/workflows/astronomer-deploy.yml'
      - '.github/workflows/keyvault-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astronomer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Determine environment, deploy type and sync
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      target: ${{ steps.plan.outputs.target }}
      deploy: ${{ steps.plan.outputs.deploy }}
      deploy_type: ${{ steps.plan.outputs.deploy_type }}
      sync: ${{ steps.plan.outputs.sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes over the complete push range
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/detect_changes.sh "$BEFORE_SHA" "$GITHUB_SHA"

      - name: Resolve target, deploy type and sync
        id: plan
        env:
          DOMAIN: orchestration
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          KEYVAULT_SYNC_MODE: ${{ vars.KEYVAULT_SYNC_MODE }}
          BASE_USABLE: ${{ steps.detect.outputs.base_usable }}
          CHG_DATABRICKS: ${{ steps.detect.outputs.databricks }}
          CHG_ORCHESTRATION: ${{ steps.detect.outputs.orchestration }}
          CHG_IMAGE: ${{ steps.detect.outputs.orchestration_image }}
          CHG_REQUEST: ${{ steps.detect.outputs.keyvault_request }}
        run: bash scripts/resolve_plan.sh

  # Single approval prompt per run. Put the required reviewers on the <env>-approval environments.
  approve:
    name: Approval
    needs: plan
    if: needs.plan.outputs.deploy == 'true' || needs.plan.outputs.sync == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: ${{ needs.plan.outputs.target }}-approval
    steps:
      - run: echo "Approved for ${{ needs.plan.outputs.target }}"

  sync-keyvault:
    name: Synchronize Key Vault
    needs: [plan, approve]
    if: needs.plan.outputs.sync == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/keyvault-sync.yml
    with:
      target: ${{ needs.plan.outputs.target }}
      runner: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    secrets: inherit

  deploy:
    name: Deploy to Astronomer (${{ needs.plan.outputs.deploy_type }})
    needs: [plan, approve, sync-keyvault]
    if: ${{ always() && needs.plan.result == 'success' && needs.approve.result == 'success' && (needs.sync-keyvault.result == 'success' || needs.sync-keyvault.result == 'skipped') && needs.plan.outputs.deploy == 'true' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: ${{ needs.plan.outputs.target }}
    permissions:
      contents: read
    steps:
      # The action checks the repository out itself.
      # deploy-type comes from the plan job (complete push range). The action's own "infer" mode looks at
      # the latest commit only, so several commits landing at once could skip DAG changes.
      # Pin the action to a reviewed commit SHA before production use.
      - name: Deploy to Astronomer
        uses: astronomer/deploy-action@v0.17.0
        with:
          deployment-id: ${{ vars.ASTRO_DEPLOYMENT_ID }}
          root-folder: orchestration
          deploy-type: ${{ needs.plan.outputs.deploy_type }}
          description: ${{ github.sha }}
          wait-time: 15m
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Astronomer deployed: ${{ needs.plan.outputs.target }}"
            echo "Deploy type: ${{ needs.plan.outputs.deploy_type }}"
            echo "Commit: $GITHUB_SHA"
            echo "Key Vault sync: ${{ needs.plan.outputs.sync }}"
          } >> "$GITHUB_STEP_SUMMARY"
