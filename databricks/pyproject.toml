[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-etl"
version = "0.1.0"
description = "Example Finance ETL Databricks wheel"
requires-python = ">=3.10"

[project.scripts]
finance-etl = "finance_etl.main:main"

[tool.setuptools.packages.find]
where = ["src"]
