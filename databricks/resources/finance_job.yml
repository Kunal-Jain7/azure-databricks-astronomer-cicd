resources:
  jobs:
    finance_etl:
      name: finance-etl-${bundle.target}
      tasks:
      - task_key: finance_task
        environment_key: default
        python_wheel_task:
          package_name: finance_etl
          entry_point: finance-etl
          parameters:
          - --catalog
          - ${var.catalog}
          - --schema
          - ${var.schema}

      # Serverless compute. This workspace only allows serverless (a "Serverless"-type workspace).
      # If "environment_version" is rejected by your CLI/workspace, use `client: "1"` instead.
      environments:
      - environment_key: default
        spec:
          environment_version: "2"
          dependencies:
          - ../dist/*.whl

      # Classic compute alternative, for Hybrid workspaces (replace environment_key above with this):
      # new_cluster:
      #   spark_version: "15.4.x-scala2.12"
      #   node_type_id: "Standard_DS3_v2"
      #   num_workers: 1
      #   data_security_mode: SINGLE_USER

      # Lets the Airflow service principal trigger this job (and nothing else).
      # The Application ID comes from the GitHub environment variable DATABRICKS_AIRFLOW_SP_APPLICATION_ID.
      # That service principal must already exist in the workspace before the first deploy.
      permissions:
      - service_principal_name: "${var.airflow_sp_application_id}"
        level: CAN_MANAGE_RUN
