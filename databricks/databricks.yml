bundle:
  name: finance-etl

include:
- resources/*.yml

artifacts:
  finance:
    type: whl
    path: .
    build: python -m build --wheel

variables:
  catalog:
    description: Destination Unity Catalog catalog
  schema:
    description: Destination schema
  airflow_sp_application_id:
    description: Application ID of the Databricks service principal that Airflow uses to run the job

targets:
  dev:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundles/${bundle.name}/${bundle.target}
  uat:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundles/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundles/${bundle.name}/${bundle.target}
